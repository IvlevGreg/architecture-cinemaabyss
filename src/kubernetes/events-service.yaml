apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: cinemaabyss
  labels:
    app: events-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: events-service
  template:
    metadata:
      labels:
        app: events-service
    spec:
      containers:
        - name: events-service
          image: ghcr.io/ivlevgreg/architecture-cinemaabyss/events-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: PORT
              value: "8082"
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/events/health
              port: 8082
          livenessProbe:
            httpGet:
              path: /api/events/health
              port: 8082
      imagePullSecrets:
        - name: dockerconfigjson

---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: cinemaabyss
spec:
  selector:
    app: events-service
  ports:
    - port: 8082
      targetPort: 8082
